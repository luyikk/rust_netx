[package]
name = "netxserver"
version = "3.0.1"
authors = ["yi lu <luyikk@126.com>"]
edition = "2021"
repository = "https://github.com/luyikk/rust_netx"
documentation = "https://docs.rs/netxserver"
description = "netx server assembly."
license = "MIT/Apache-2.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tcpserver"]
use_openssl = ["openssl", "openssl-sys", "tokio-openssl"]
use_rustls = ["tokio-rustls"]
dserde = ["data-rw/data"]
jserde = ["data-rw/json"]
backtrace = ["anyhow/backtrace"]

[dependencies]
tokio.workspace = true
serde.workspace = true
aqueue.workspace = true
async-trait.workspace = true
anyhow.workspace = true
log.workspace = true
data-rw.workspace = true
paste.workspace = true
netxbuilder.workspace = true
cfg-if.workspace = true
oneshot.workspace = true
thiserror.workspace = true

# transport (optional, mutually exclusive with tcp-channel-server)
tcpserver = { version = "2.2.3", optional = true }
tcp-channel-server = { version = "0.3.2", optional = true }

# crate-specific
bytes = "1.1"
chrono = "0.4"

# tls (optional)
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }
tokio-openssl = { version = "0.6", optional = true }
tokio-rustls = { version = "0.26", optional = true }

[dev-dependencies]
env_logger.workspace = true
serde.workspace = true
log.workspace = true
mimalloc.workspace = true
rustls-pemfile.workspace = true