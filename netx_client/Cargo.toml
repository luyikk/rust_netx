[package]
name = "netxclient"
version = "3.0.1"
authors = ["luyi <luyikk@126.com>"]
edition = "2021"
repository = "https://github.com/luyikk/rust_netx"
documentation = "https://docs.rs/netxclient"
description = "netx client assembly."
license = "MIT/Apache-2.0"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tcpclient"]
use_openssl = ["openssl", "openssl-sys", "tokio-openssl"]
use_rustls = ["tokio-rustls"]
dserde = ["data-rw/data"]
jserde = ["data-rw/json"]
backtrace = ["anyhow/backtrace"]

[dependencies]
tokio = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
aqueue = { workspace = true }
async-trait = { workspace = true }
data-rw = { workspace = true }
netxbuilder = { workspace = true }
anyhow = { workspace = true }
cfg-if = { workspace = true }
paste = { workspace = true }
oneshot = { workspace = true }
thiserror = { workspace = true }

# transport (optional, mutually exclusive with tcp-channel-client)
tcpclient = { version = "2.1", optional = true }
tcp-channel-client = { version = "0.4.2", optional = true }

# crate-specific
serde_json = "1.0"
once_cell = "1.10"

# tls (optional)
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }
tokio-openssl = { version = "0.6", optional = true }
tokio-rustls = { version = "0.26", optional = true }

[dev-dependencies]
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
mimalloc = { version = "0.1", default-features = false }
structopt = "0.3"
rustls-pemfile = { version = "2" }